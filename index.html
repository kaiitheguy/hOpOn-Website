<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hOpOn | Agentic Growth Platform for Local Businesses</title>
    <meta name="description" content="Reach high-intent local customers through creators, unlock audiences other platforms miss, and measure every visit, conversion, and dollar of growth." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              'hopon-black': '#050505',
              'hopon-grey': '#F2F2F2',
              'hopon-red': '#FF2A2A',
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 100px;
        scroll-snap-type: y proximity;
      }

      #demo {
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }

      #why {
        scroll-snap-align: start;
      }
      
      .fade-up-enter {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .fade-up-active {
        opacity: 1;
        transform: translateY(0);
      }
      
      .stagger-1 { transition-delay: 100ms; }
      .stagger-2 { transition-delay: 200ms; }
      .stagger-3 { transition-delay: 300ms; }
      .stagger-4 { transition-delay: 400ms; }

      .hero-phone-shell {
        animation: hero-phone-rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .hero-phone-image {
        animation: hero-screen-pan 8s ease-in-out infinite alternate;
        transform-origin: center;
      }

      .hero-roi-card {
        z-index: 8;
        opacity: 1;
        transform: translate3d(22px, -10px, 0) scale(0.96);
        transition: opacity 460ms cubic-bezier(0.16, 1, 0.3, 1), transform 460ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 460ms cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: center;
        will-change: transform, opacity;
        backface-visibility: hidden;
      }

      .hero-visual-group:hover .hero-roi-card,
      .hero-phone-hit:hover ~ .hero-roi-card {
        z-index: 35;
        opacity: 1;
        transform: translate3d(-18px, 24px, 0) scale(1.04);
        box-shadow: 0 34px 90px rgba(0, 0, 0, 0.24);
      }

      .hero-float-card {
        animation: hero-float 5.5s ease-in-out infinite;
      }

      .hero-float-delay {
        animation-delay: 900ms;
      }

      .hero-float-delay-2 {
        animation-delay: 1600ms;
      }

      @keyframes hero-phone-rise {
        0% { opacity: 0; transform: translateY(24px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes hero-screen-pan {
        0% { transform: scale(1.04) translateY(0); }
        100% { transform: scale(1.1) translateY(-18px); }
      }

      @keyframes hero-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      .demo-phone-screen {
        animation: demo-phone-swap 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
        will-change: transform, opacity;
        backface-visibility: hidden;
      }

      .demo-mobile-step-card {
        animation: demo-step-swap 320ms cubic-bezier(0.16, 1, 0.3, 1) both;
        will-change: transform, opacity;
      }

      @keyframes demo-phone-swap {
        0% {
          opacity: 0;
          transform: translate3d(18px, 0, 0) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes demo-step-swap {
        0% {
          opacity: 0.72;
          transform: translate3d(0, 8px, 0);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero-phone-shell,
        .hero-phone-image,
        .hero-float-card,
        .demo-phone-screen,
        .demo-mobile-step-card {
          animation: none;
        }

        .hero-roi-card {
          transition: none;
        }
      }

      /* Keep the pixel-style logo crisp without degrading product photography. */
      svg {
        image-rendering: pixelated;
      }
      img {
        image-rendering: auto;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
</head>
  <body class="bg-white text-hopon-black antialiased selection:bg-hopon-black selection:text-white">
    <script src="/config.js"></script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
